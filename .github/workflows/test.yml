name: Test

# Runs the test suite (parser regressions + read-only tool-surface guards) on every push and PR.
#
# aiseg2-mcp is a PUBLIC repo (PyPI/MCP Registry distribution), so `pull_request` can carry
# fork-authored code and this repo's fork-PR-contributor-approval policy is the default
# first_time_contributors (only a contributor's *first* fork PR needs manual approval; later ones
# run unattended). The self-hosted arc-runner-aiseg2-mcp scale set shares white's single node with
# dind and the ESO-delivered secrets (fumo-k8s-platform §4.2, PSA privileged in ns arc-runners), so
# `pull_request` stays on the GitHub-hosted runner and only `push` (maintainer-authored history) uses
# the self-hosted runner. See chanyou0311/aidlc-workspace#495 for the open follow-up (raising the
# fork-PR approval policy to "all external contributors" is tracked as human/prod work, not fixed
# here).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'arc-runner-aiseg2-mcp' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps (locked)
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
