name: Build and Push

# Builds the MCP server image and pushes it to GHCR (fumo homelab delivery). This job also pins the
# resulting tag+digest into k8s/overlays/production/kustomization.yaml (image-updater is retired; CI
# does the write-back). Independent of test.yml / release.yml (PyPI + public GHCR distribution).
# Excludes k8s/** on purpose: the digest-pin commit lands under k8s/, so triggering on it would loop
# forever (writeback -> build -> new tag -> writeback -> ...).

on:
  push:
    branches: [main, add-white-server-to-fumo-k3s] # TODO(段4): rebuild ブランチを外す
    paths-ignore:
      - 'k8s/**'
      - '*.md'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chanyou0311/aiseg2-mcp
  OVERLAY: k8s/overlays/production

jobs:
  build:
    runs-on: arc-runner-aiseg2-mcp
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # aiseg2-mcp is already a public GHCR package (PyPI/MCP Registry distribution); keep the
          # build cache off that public-facing ref by using a dedicated -buildcache package.
          cache-from: type=registry,ref=ghcr.io/chanyou0311/aiseg2-mcp-buildcache:cache
          cache-to: type=registry,ref=ghcr.io/chanyou0311/aiseg2-mcp-buildcache:cache,mode=max

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.8.1'

      - name: Pin digest into the overlay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          (cd "$OVERLAY" && kustomize edit set image "$IMAGE=$IMAGE:$tag@$DIGEST")
          if git diff --quiet -- "$OVERLAY"; then
            echo "no manifest change; skipping write-back"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          git commit -m "chore(k8s): pin aiseg2-mcp to ${tag}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            branch="bump/aiseg2-mcp-${tag}"
            git checkout -b "$branch"
            git push origin "$branch"
            # ARC runner image (ghcr.io/actions/actions-runner) has no gh CLI (GitHub-hosted only),
            # so call the REST API with curl (bundled in the runner image) instead of `gh pr create`.
            curl -sf -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
              -d "$(jq -n --arg title "chore(k8s): pin aiseg2-mcp to ${tag}" \
                         --arg head "$branch" \
                         --arg body "Automated digest pin from ${GITHUB_SHA}." \
                         '{title: $title, head: $head, base: "main", body: $body}')"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
