name: Build and Push

# Builds the MCP server image and pushes it to GHCR (fumo homelab delivery). Deployment (which
# manifest, which cluster) lives in fumo-infra; ArgoCD Image Updater there watches this image's
# `sha-<7hex>` tags and rolls the deployment forward on its own. This workflow's job ends at the
# push. Independent of test.yml / release.yml (PyPI + public GHCR distribution).
#
# fumo-infra's Image Updater picks the tag by newest-build (image created timestamp), so this job
# only ever runs for main (job-level `if`, since workflow_dispatch can target any branch/commit) and
# stamps the image's created timestamp to the source commit's time, not the build time.

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      no_cache:
        description: ビルドキャッシュを使わずに作り直す (キャッシュが壊れた疑いがあるとき)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chanyou0311/aiseg2-mcp

jobs:
  build:
    # workflow_dispatch can be run from any branch/commit; only ever push from main (see header
    # comment). A job-level `if` (rather than filtering the trigger) stops the whole job, not just
    # the push step.
    if: github.ref_name == 'main'
    runs-on: arc-runner-aiseg2-mcp
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Set SOURCE_DATE_EPOCH (image created timestamp = commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.no_cache == true }}
          # Follows the conventions-sheet §3.1 default (ghcr.io/chanyou0311/<name>:buildcache) used
          # by the other repos (e.g. fumo-op-mcp), rather than a dedicated -buildcache package: a
          # standalone package's first-push auto-creation and resulting visibility are unverified and
          # would risk failing the very first CI run on this package.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
