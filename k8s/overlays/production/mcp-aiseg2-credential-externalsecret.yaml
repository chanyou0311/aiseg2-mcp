# AiSEG2 web UI password (HTTP Digest), delivered by External Secrets Operator from 1Password (SDK
# provider). Name kept as-is (mcp-aiseg2-credential) — only the placement moves here from
# fumo-k8s-platform, to live alongside its consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-aiseg2-credential
  namespace: mcp
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-fumo
  target:
    name: mcp-aiseg2-credential
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: "AiSEG2/password"
