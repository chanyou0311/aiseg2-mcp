# Panasonic AiSEG2 (HEMS) MCP server (FastMCP streamable-http).
#
# mcp-auth-aiseg2 (GitHub OAuth front door) lives in fumo-k8s-platform (P/mcp/), not here — it fronts
# this Service over the cluster network so its ephemeral OAuth state (PVC) survives an MCP-image
# redeploy without a claude.ai re-auth. The raw MCP Service is ClusterIP-only; only the platform-side
# proxy is exposed via Ingress.
#
# Secrets: the AiSEG2 password (mcp-aiseg2-credential) is delivered by ESO from this repo's own
# overlay (k8s/overlays/production/); the auth-proxy's GitHub OAuth creds live on the platform side.
---
# The MCP server. Scrapes the AiSEG2's LAN web UI (http Digest) and exposes read-only tools.
# Cluster-internal only (:8000). DNS-rebinding protection is disabled because the server sits behind
# the authenticating proxy (the trust boundary) whose forwarded Host would otherwise trip the SDK's
# allowlist (HTTP 421).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiseg2-mcp
  labels:
    app: aiseg2-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiseg2-mcp
  template:
    metadata:
      labels:
        app: aiseg2-mcp
    spec:
      priorityClassName: app-core
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Initial tag is a placeholder; the first CI build pushes a 7-hex SHA tag and the digest is
          # pinned in k8s/overlays/production/kustomization.yaml (until then the pod is
          # ImagePullBackOff — expected for a new repo).
          image: ghcr.io/chanyou0311/aiseg2-mcp:0000000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: mcp
          env:
            - name: AISEG_URL
              value: "http://192.168.100.216"
            - name: AISEG_USER
              value: "aiseg"
            - name: AISEG_TRANSPORT
              value: "streamable-http"
            # Behind the auth-proxy (trust boundary): disable the SDK Host allowlist so the proxied
            # Host header does not get rejected with HTTP 421.
            - name: AISEG_DISABLE_DNS_REBINDING_PROTECTION
              value: "true"
            # SD-card history cache on an emptyDir (survives within the pod, re-downloaded on restart).
            - name: AISEG_CACHE_DIR
              value: "/cache"
            # HTTP Digest password for the AiSEG2 web UI. Delivered by ESO from 1Password; never
            # baked into the image or logged.
            - name: AISEG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-aiseg2-credential
                  key: password
          volumeMounts:
            - name: cache
              mountPath: /cache
          # An httpGet on /mcp returns 406 (needs Accept: text/event-stream), so gate readiness on
          # the TCP port; use the dedicated /health route for liveness.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: cache
          emptyDir:
            # Bounded: the SD-card export is <1MB zipped (~10MB extracted); prevents
            # node DiskPressure if a firmware ever returns unexpectedly large exports.
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aiseg2-mcp
spec:
  selector:
    app: aiseg2-mcp
  ports:
    - port: 8000
      targetPort: 8000
      name: mcp
